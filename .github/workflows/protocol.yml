name: protocol
on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 12 случаев, две формулы (v6 против v7)
        run: python3 compendium_run.py

      - name: Конечный автомат протокола (порядок расследования enforced)
        run: python3 protocol_fsm.py
